<svg xmlns="http://www.w3.org/2000/svg" width="640" height="308" viewBox="0 0 640 308" role="img" aria-labelledby="title desc">
<title id="title">How deleting two vertices splits a graph</title>
<desc id="desc">Before deletion there are six vertices. Edges join 1–2, 1–4, 1–5, 2–3, 2–4, 3–4, 3–5, 3–6 and 4–6. Deleting the double-ringed vertices 3 and 4 leaves a path from 5 through 1 to 2, and the isolated vertex 6.</desc>
<rect width="640" height="308" rx="8" fill="#fff"/>
<g fill="#20384a" font-family="system-ui, -apple-system, sans-serif">
<path d="M320 22V289" stroke="#dbe3e5" stroke-width="2"/>
<text x="160" y="36" font-size="24" font-weight="650" fill="#20384a" text-anchor="middle">Before deletion</text>
<text x="480" y="36" font-size="24" font-weight="650" fill="#20384a" text-anchor="middle">After deleting 3 and 4</text>
<g transform="translate(0 0)">
<line data-edge="1-2" x1="177" y1="88" x2="138" y2="150" stroke="#485d6b" stroke-width="3.2"/>
<line data-edge="1-4" x1="177" y1="88" x2="238" y2="193" stroke="#485d6b" stroke-width="3.2"/>
<line data-edge="1-5" x1="177" y1="88" x2="57" y2="95" stroke="#485d6b" stroke-width="3.2"/>
<line data-edge="2-3" x1="138" y1="150" x2="65" y2="187" stroke="#485d6b" stroke-width="3.2"/>
<line data-edge="2-4" x1="138" y1="150" x2="238" y2="193" stroke="#485d6b" stroke-width="3.2"/>
<line data-edge="3-4" x1="65" y1="187" x2="238" y2="193" stroke="#485d6b" stroke-width="3.2"/>
<line data-edge="3-5" x1="65" y1="187" x2="57" y2="95" stroke="#485d6b" stroke-width="3.2"/>
<line data-edge="3-6" x1="65" y1="187" x2="155" y2="250" stroke="#485d6b" stroke-width="3.2"/>
<line data-edge="4-6" x1="238" y1="193" x2="155" y2="250" stroke="#485d6b" stroke-width="3.2"/>
<g data-node="1">
<circle cx="177" cy="88" r="17.5" fill="#e3f2f2" stroke="#176478" stroke-width="2.4"/>
<text x="177" y="95" font-size="21" font-weight="650" fill="#20384a" text-anchor="middle">1</text>
</g>
<g data-node="2">
<circle cx="138" cy="150" r="17.5" fill="#e3f2f2" stroke="#176478" stroke-width="2.4"/>
<text x="138" y="157" font-size="21" font-weight="650" fill="#20384a" text-anchor="middle">2</text>
</g>
<g data-node="3">
<circle cx="65" cy="187" r="22" fill="#fff" stroke="#9b4328" stroke-width="2"/>
<circle cx="65" cy="187" r="17.5" fill="#f8e5db" stroke="#9b4328" stroke-width="2.4"/>
<text x="65" y="194" font-size="21" font-weight="650" fill="#20384a" text-anchor="middle">3</text>
</g>
<g data-node="4">
<circle cx="238" cy="193" r="22" fill="#fff" stroke="#9b4328" stroke-width="2"/>
<circle cx="238" cy="193" r="17.5" fill="#f8e5db" stroke="#9b4328" stroke-width="2.4"/>
<text x="238" y="200" font-size="21" font-weight="650" fill="#20384a" text-anchor="middle">4</text>
</g>
<g data-node="5">
<circle cx="57" cy="95" r="17.5" fill="#e3f2f2" stroke="#176478" stroke-width="2.4"/>
<text x="57" y="102" font-size="21" font-weight="650" fill="#20384a" text-anchor="middle">5</text>
</g>
<g data-node="6">
<circle cx="155" cy="250" r="17.5" fill="#e3f2f2" stroke="#176478" stroke-width="2.4"/>
<text x="155" y="257" font-size="21" font-weight="650" fill="#20384a" text-anchor="middle">6</text>
</g>
</g>
<g transform="translate(320 0)">
<line data-edge="1-2" x1="177" y1="88" x2="138" y2="150" stroke="#485d6b" stroke-width="3.2"/>
<line data-edge="1-5" x1="177" y1="88" x2="57" y2="95" stroke="#485d6b" stroke-width="3.2"/>
<g data-node="1">
<circle cx="177" cy="88" r="17.5" fill="#e3f2f2" stroke="#176478" stroke-width="2.4"/>
<text x="177" y="95" font-size="21" font-weight="650" fill="#20384a" text-anchor="middle">1</text>
</g>
<g data-node="2">
<circle cx="138" cy="150" r="17.5" fill="#e3f2f2" stroke="#176478" stroke-width="2.4"/>
<text x="138" y="157" font-size="21" font-weight="650" fill="#20384a" text-anchor="middle">2</text>
</g>
<g data-node="5">
<circle cx="57" cy="95" r="17.5" fill="#e3f2f2" stroke="#176478" stroke-width="2.4"/>
<text x="57" y="102" font-size="21" font-weight="650" fill="#20384a" text-anchor="middle">5</text>
</g>
<g data-node="6">
<circle cx="155" cy="250" r="17.5" fill="#e3f2f2" stroke="#176478" stroke-width="2.4"/>
<text x="155" y="257" font-size="21" font-weight="650" fill="#20384a" text-anchor="middle">6</text>
</g>
</g>
<text x="160" y="292" font-size="19" font-weight="500" fill="#485d6b" text-anchor="middle">One component</text>
<text x="480" y="292" font-size="19" font-weight="500" fill="#485d6b" text-anchor="middle">Two components</text>
</g>
</svg>
