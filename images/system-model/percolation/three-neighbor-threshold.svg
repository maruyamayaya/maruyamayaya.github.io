<svg xmlns="http://www.w3.org/2000/svg" width="710" height="425" viewBox="0 0 710 425" role="img" aria-labelledby="title desc">
<title id="title">A common threshold but two different giant-cluster sizes</title>
<desc id="desc">On a random three-regular network, both site and bond percolation have zero giant share below one half. Above one half the bond curve rises faster. At occupation three quarters, bonds give twenty-six twenty-sevenths and sites give thirteen eighteenths of the initial population.</desc>
