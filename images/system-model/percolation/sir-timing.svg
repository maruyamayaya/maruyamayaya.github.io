<svg xmlns="http://www.w3.org/2000/svg" width="710" height="405" viewBox="0 0 710 405" role="img" aria-labelledby="title desc">
<title id="title">An outbreak peaks while half the population is still susceptible</title>
<desc id="desc">A well-mixed SIR outbreak with basic reproduction number two and initial infectious fraction one percent. The susceptible fraction falls, the removed fraction rises, and the infectious fraction peaks near sixteen percent when half the population remains susceptible.</desc>
<rect width="710" height="405" rx="8" fill="white"/>
<g font-family="system-ui, sans-serif" fill="#23384a">
<text x="24" y="35" font-size="23" font-weight="650">At the peak, new cases still occur</text>
<text x="24" y="60" font-size="15">Well-mixed SIR · R₀ = 2 · 1% initially infectious</text>
